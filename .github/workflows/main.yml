name: Build Windows VST3 & Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone JUCE
        working-directory: "fianl snoopy/OSOTRUXE"
        run: |
          git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        working-directory: "fianl snoopy/OSOTRUXE"
        run: |
          cmake -B build -A x64

      - name: Build VST3 & Standalone (Release)
        working-directory: "fianl snoopy/OSOTRUXE"
        run: |
          cmake --build build --config Release --parallel

      - name: Stage Installer Files
        working-directory: "fianl snoopy/OSOTRUXE"
        run: |
          mkdir stage
          Copy-Item -Recurse "build\OSOTRUXE_artefacts\Release\VST3\OSOTRUXE.vst3" "stage\OSOTRUXE.vst3"


      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OSOTRUXE-Windows-VST3
          path: |
            fianl snoopy\OSOTRUXE\stage\OSOTRUXE.vst3
      
